[package]
name = "hcr_core"
version = "0.1.0"
edition = "2024"
description = "Hair cutting simulation kernel — hair cards + PBD, pure Rust, no I/O"

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
rand = "0.8"

[features]
default = []
snapshot = ["dep:serde", "dep:serde_json"]
